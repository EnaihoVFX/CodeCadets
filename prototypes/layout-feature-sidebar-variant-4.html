<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Layout · Feature Sidebar · Variant 4</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #111111;
    }
    .shell {
      width: 640px;
      margin: 0 auto;
      display: grid;
      gap: 12px;
    }
    header, footer {
      background: #f2f2f2;
      padding: 12px;
      border: 1px solid #dddddd;
      border-radius: 12px;
    }
    .layout {
      display: grid;
      grid-template-columns: 1.8fr 1fr;
      gap: 12px;
    }
    .feature {
      background: #ebebeb;
      border: 1px solid #cccccc;
      border-radius: 12px;
      padding: 12px;
      height: 240px;
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 10px;
    }
    .feature .body {
      background: #dddddd;
      border: 1px solid #cccccc;
      border-radius: 10px;
      padding: 12px;
    }
    .feature .footer-row {
      background: #e5e5e5;
      border: 1px solid #cccccc;
      border-radius: 10px;
      height: 60px;
      padding: 10px;
    }
    .sidebar {
      display: grid;
      gap: 12px;
    }
    .sidebar .slot {
      background: #f0f0f0;
      border: 1px solid #cccccc;
      border-radius: 10px;
      height: 110px;
      padding: 10px;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>Header</header>
    <div class="layout">
      <div class="feature">
        <div class="body">Tall feature block</div>
        <div class="footer-row">Summary / call to action</div>
      </div>
      <div class="sidebar">
        <div class="slot">Sidebar item 1</div>
        <div class="slot">Sidebar item 2</div>
        <div class="slot">Sidebar item 3</div>
      </div>
    </div>
    <footer>Footer</footer>
  </div>
</body>
</html>
