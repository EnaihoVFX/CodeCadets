<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Layout · Feature Sidebar · Variant 3</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #111111;
    }
    .shell {
      width: 640px;
      margin: 0 auto;
      display: grid;
      gap: 12px;
    }
    header, footer {
      background: #f2f2f2;
      padding: 12px;
      border: 1px solid #dddddd;
      border-radius: 12px;
    }
    .layout {
      display: grid;
      grid-template-columns: 3fr 2fr;
      gap: 12px;
    }
    .feature {
      background: #e9e9e9;
      border: 1px solid #cccccc;
      border-radius: 12px;
      padding: 12px;
      display: grid;
      gap: 12px;
    }
    .feature .hero {
      background: #dfdfdf;
      border: 1px solid #c9c9c9;
      border-radius: 10px;
      height: 160px;
      padding: 12px;
    }
    .feature .cta-row {
      background: #ececec;
      border: 1px solid #cecece;
      border-radius: 10px;
      height: 70px;
      padding: 10px;
    }
    .sidebar {
      background: #f5f5f5;
      border: 1px solid #dcdcdc;
      border-radius: 12px;
      padding: 12px;
      display: grid;
      gap: 10px;
    }
    .sidebar .slot {
      background: #e8e8e8;
      border: 1px solid #cccccc;
      border-radius: 10px;
      height: 70px;
      padding: 10px;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>Header</header>
    <div class="layout">
      <div class="feature">
        <div class="hero">Hero feature</div>
        <div class="cta-row">Button row / quick links</div>
      </div>
      <div class="sidebar">
        <div class="slot">Detail slot 1</div>
        <div class="slot">Detail slot 2</div>
      </div>
    </div>
    <footer>Footer</footer>
  </div>
</body>
</html>
