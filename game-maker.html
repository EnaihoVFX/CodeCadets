<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Maker</title>
  <link rel="icon" type="image/png" href="icons/logo/iconlogo.png">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
    }

    body {
      width: 420px;
      min-height: 600px;
      font-family: 'Press Start 2P', monospace;
      background: #000;
      color: #10B981;
      display: flex;
      align-items: stretch;
      justify-content: center;
    }

    .container {
      display: flex;
      flex-direction: column;
      min-height: 680px;
      max-height: 680px;
      width: 100%;
      border: none;
      background: #0a0a0a;
      box-shadow: none;
      position: relative;
      overflow: hidden;
    }

    .main-content {
      flex: 1;
      background: #000;
      overflow-y: auto;
      position: relative;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 16px;
      padding: 16px;
    }

    .grid-rectangle {
      background: linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 100%);
      border: 3px solid #10B981;
      border-radius: 12px;
      position: relative;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 120px;
    }

    .grid-rectangle::before {
      content: '';
      position: absolute;
      top: 4px;
      left: 4px;
      right: -4px;
      bottom: -4px;
      border: 2px solid #7C3AED;
      border-radius: 12px;
      z-index: -1;
      transition: all 0.3s ease;
    }

    .grid-rectangle:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.4);
      border-color: #34D399;
      background: linear-gradient(135deg, #1a2e1a 0%, #0f1f0f 100%);
    }

    .grid-rectangle:hover::before {
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border-color: #10B981;
    }

    /* Footer Section */
    .footer {
      background: #000;
      border-top: 4px solid #10B981;
      padding: 12px 16px;
      position: relative;
      min-height: 80px;
      max-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .footer::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: #7C3AED;
    }

    .footer-buttons {
      display: flex;
      gap: 12px;
      width: 100%;
      justify-content: space-between;
      align-items: center;
    }

    .footer-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px;
      background: linear-gradient(135deg, #000 0%, #1a1a1a 100%);
      border: 3px solid #7C3AED;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      min-height: 60px;
      position: relative;
      font-family: 'Press Start 2P', monospace;
    }

    .footer-btn::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      right: -2px;
      bottom: -2px;
      border: 2px solid #10B981;
      border-radius: 12px;
      z-index: -1;
      transition: all 0.2s ease;
    }

    .footer-btn:hover {
      background: linear-gradient(135deg, #10B981 0%, #059669 100%);
      border-color: #10B981;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
    }

    .footer-btn:hover::after {
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border-color: #047857;
    }

    .footer-btn:hover .footer-btn-label {
      color: #000;
    }

    .footer-btn:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
    }

    .footer-btn-icon {
      width: 24px;
      height: 24px;
      image-rendering: crisp-edges;
      filter: drop-shadow(2px 2px 0px rgba(0, 0, 0, 0.3));
      transition: transform 0.2s ease;
    }

    .footer-btn:hover .footer-btn-icon {
      transform: scale(1.1) rotate(-5deg);
      filter: drop-shadow(2px 2px 4px rgba(0, 0, 0, 0.5));
    }

    .footer-btn-label {
      font-size: 6px;
      color: #10B981;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-align: center;
      line-height: 1.2;
      transition: color 0.2s ease;
    }
  </style>
</head>
<body>
  <div class="container">
    <main class="main-content" aria-label="Game Maker workspace">
      <div class="grid-rectangle" role="button" tabindex="0"></div>
      <div class="grid-rectangle" role="button" tabindex="0"></div>
      <div class="grid-rectangle" role="button" tabindex="0"></div>
      <div class="grid-rectangle" role="button" tabindex="0"></div>
    </main>
    
    <!-- Footer Section -->
    <footer class="footer">
      <div class="footer-buttons">
        <button class="footer-btn" id="help-btn" title="Help">
          <img src="iconpack/Png/question_help.png" alt="Help" class="footer-btn-icon">
          <span class="footer-btn-label">Help</span>
        </button>
        <button class="footer-btn" id="settings-btn" title="Settings">
          <img src="icons/gears/gear1.png" alt="Settings" class="footer-btn-icon">
          <span class="footer-btn-label">Settings</span>
        </button>
        <button class="footer-btn" id="achievements-footer-btn" title="Awards">
          <img src="iconpack/Png/medal.png" alt="Awards" class="footer-btn-icon">
          <span class="footer-btn-label">Awards</span>
        </button>
        <button class="footer-btn" id="profile-btn" title="Profile">
          <img src="icons/robot.png" alt="Profile" class="footer-btn-icon">
          <span class="footer-btn-label">Profile</span>
        </button>
      </div>
    </footer>
  </div>
</body>
</html>
