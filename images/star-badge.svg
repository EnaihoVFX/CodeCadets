<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" style="image-rendering: pixelated; image-rendering: -moz-crisp-edges; image-rendering: crisp-edges;">
  <!-- Pixel-style 5-pointed star badge made with blocks -->
  <!-- Top point -->
  <rect x="7" y="0" width="2" height="2" fill="#FBBF24"/>
  <!-- Top left -->
  <rect x="5" y="2" width="2" height="2" fill="#FBBF24"/>
  <rect x="6" y="3" width="2" height="2" fill="#FBBF24"/>
  <!-- Top right -->
  <rect x="9" y="2" width="2" height="2" fill="#FBBF24"/>
  <rect x="8" y="3" width="2" height="2" fill="#FBBF24"/>
  <!-- Left point -->
  <rect x="2" y="5" width="2" height="2" fill="#FBBF24"/>
  <rect x="3" y="6" width="2" height="2" fill="#FBBF24"/>
  <rect x="4" y="7" width="2" height="2" fill="#FBBF24"/>
  <!-- Right point -->
  <rect x="12" y="5" width="2" height="2" fill="#FBBF24"/>
  <rect x="11" y="6" width="2" height="2" fill="#FBBF24"/>
  <rect x="10" y="7" width="2" height="2" fill="#FBBF24"/>
  <!-- Center -->
  <rect x="6" y="6" width="4" height="4" fill="#FBBF24"/>
  <!-- Bottom left -->
  <rect x="4" y="9" width="2" height="2" fill="#FBBF24"/>
  <rect x="5" y="10" width="2" height="2" fill="#FBBF24"/>
  <rect x="3" y="11" width="2" height="2" fill="#FBBF24"/>
  <!-- Bottom right -->
  <rect x="10" y="9" width="2" height="2" fill="#FBBF24"/>
  <rect x="9" y="10" width="2" height="2" fill="#FBBF24"/>
  <rect x="11" y="11" width="2" height="2" fill="#FBBF24"/>
  <!-- Bottom point -->
  <rect x="7" y="13" width="2" height="2" fill="#FBBF24"/>
  <rect x="6" y="14" width="4" height="2" fill="#FBBF24"/>
</svg>





